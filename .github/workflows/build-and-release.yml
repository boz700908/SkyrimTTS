name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        required: false
        default: 'false'
        type: boolean

env:
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '52f5569a8e867859fac967c1e3f10ca0a8a3cc39'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake --preset ci-release

      - name: Build
        run: cmake --build build/ci-release --config Release

      - name: Verify Release DLL
        shell: bash
        run: |
          DLL="build/ci-release/SkyrimNVDA.dll"
          if [ ! -f "$DLL" ]; then
            echo "ERROR: SkyrimNVDA.dll not found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$DLL" 2>/dev/null || stat -f%z "$DLL")
          echo "DLL size: $SIZE bytes"
          if [ "$SIZE" -gt 3000000 ]; then
            echo "ERROR: DLL is too large ($SIZE bytes) - this looks like a Debug build!"
            exit 1
          fi
          echo "DLL size OK (Release build confirmed)"

      - name: Create release zip
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGING="staging"
          mkdir -p "$STAGING/SKSE/Plugins"
          mkdir -p "$STAGING/Scripts"
          mkdir -p "$STAGING/Sound/fx/SkyrimTTS"
          mkdir -p "$STAGING/Root"
          mkdir -p "$STAGING/fomod"

          # Plugin DLL
          cp "build/ci-release/SkyrimNVDA.dll" "$STAGING/SKSE/Plugins/"
          cp "SkyrimNVDA.ini" "$STAGING/SKSE/Plugins/"

          # NVDA controller DLL -> Root (installed to game root via FOMOD)
          cp "lib/nvdaControllerClient.dll" "$STAGING/Root/"

          # ESP + PEX scripts
          cp "autowalk/SkyrimTTS_AutoWalk.esp" "$STAGING/"
          cp "autowalk/SkyrimTTS_AutoWalk.pex" "$STAGING/Scripts/"
          cp "autowalk/SkyrimTTS_MQ105Fix.pex" "$STAGING/Scripts/"
          cp "autowalk/SkyrimTTS_MCM.pex" "$STAGING/Scripts/"
          cp "autowalk/SkyrimTTS_MCM_Native.pex" "$STAGING/Scripts/"

          # Sound effects
          cp sounds/aim_loop.wav "$STAGING/Sound/fx/SkyrimTTS/"
          cp sounds/dragon_hit.wav "$STAGING/Sound/fx/SkyrimTTS/"
          cp sounds/enemy_death.wav "$STAGING/Sound/fx/SkyrimTTS/"

          # Documentation (MD to TXT)
          cp CHANGELOG.md "$STAGING/CHANGELOG.txt"
          cp README.md "$STAGING/README.txt"
          cp GUIDE.md "$STAGING/GUIDE.txt"
          cp GUIDE_FR.md "$STAGING/GUIDE_FR.txt"
          cp LISEZMOI.md "$STAGING/LISEZMOI.txt" 2>/dev/null || true

          # FOMOD installer (info.xml + moduleconfig.xml)
          cp fomod/info.xml "$STAGING/fomod/"
          cp fomod/moduleconfig.xml "$STAGING/fomod/"
          sed -i "s|<Version>.*</Version>|<Version>${VERSION#v}</Version>|" "$STAGING/fomod/info.xml"

          # Create zip
          cd "$STAGING"
          7z a -tzip "../SkyrimNVDA-${VERSION}.zip" .
          cd ..
          echo "ZIP_NAME=SkyrimNVDA-${VERSION}.zip" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimNVDA-${{ github.ref_name || 'dev' }}
          path: ${{ env.ZIP_NAME || 'SkyrimNVDA-dev.zip' }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
